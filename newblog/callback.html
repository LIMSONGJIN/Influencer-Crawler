<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogCraft Pro - 로그인 처리중...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-12 text-center max-w-md">
        <div class="mb-6">
            <i class="fas fa-spinner spinner text-6xl text-purple-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">로그인 처리중...</h2>
        <p class="text-gray-600 mb-4">잠시만 기다려주세요.</p>
        <p class="text-sm text-gray-500">자동으로 이동되지 않으면 <a href="saas-dashboard.html" class="text-purple-600 hover:underline">여기</a>를 클릭하세요.</p>
    </div>

    <script>
        // OAuth 콜백 처리
        function handleOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            // State 파라미터로 provider 식별
            const state = urlParams.get('state') || hashParams.get('state');
            const code = urlParams.get('code');
            const accessToken = hashParams.get('access_token');
            const error = urlParams.get('error') || hashParams.get('error');
            
            if (error) {
                alert('로그인 중 오류가 발생했습니다: ' + error);
                window.location.href = 'saas-login.html';
                return;
            }
            
            if (state && (code || accessToken)) {
                // 실제 환경에서는 백엔드 API를 호출하여 토큰 검증 및 사용자 정보 조회
                // 여기서는 데모용으로 처리
                
                let providerName = '';
                switch(state) {
                    case 'google':
                        providerName = 'Google';
                        // Google API를 통해 사용자 정보 조회 (실제 구현 필요)
                        if (accessToken) {
                            fetch('https://www.googleapis.com/oauth2/v1/userinfo?alt=json&access_token=' + accessToken)
                                .then(response => response.json())
                                .then(data => {
                                    localStorage.setItem('isLoggedIn', 'true');
                                    localStorage.setItem('loginProvider', 'google');
                                    localStorage.setItem('userEmail', data.email);
                                    localStorage.setItem('userName', data.name);
                                    localStorage.setItem('userPicture', data.picture);
                                    localStorage.setItem('subscriptionPlan', 'free');
                                    
                                    window.location.href = 'saas-dashboard.html';
                                })
                                .catch(err => {
                                    console.error('Google 로그인 오류:', err);
                                    // 데모 모드
                                    handleDemoLogin('google', 'Google');
                                });
                        } else {
                            handleDemoLogin('google', 'Google');
                        }
                        break;
                        
                    case 'kakao':
                        providerName = '카카오';
                        // Kakao의 경우 authorization code를 백엔드로 보내서 access token을 받아야 함
                        // 여기서는 데모용으로 처리
                        handleDemoLogin('kakao', '카카오');
                        break;
                        
                    case 'naver':
                        providerName = '네이버';
                        // Naver의 경우 authorization code를 백엔드로 보내서 access token을 받아야 함
                        // 여기서는 데모용으로 처리
                        handleDemoLogin('naver', '네이버');
                        break;
                        
                    default:
                        alert('알 수 없는 로그인 제공자입니다.');
                        window.location.href = 'saas-login.html';
                        return;
                }
            } else {
                // 파라미터가 없으면 로그인 페이지로 리다이렉트
                window.location.href = 'saas-login.html';
            }
        }
        
        function handleDemoLogin(provider, providerName) {
            // 데모용 로그인 처리
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('loginProvider', provider);
            localStorage.setItem('userEmail', `demo@${provider}.com`);
            localStorage.setItem('userName', `${providerName} 사용자`);
            localStorage.setItem('subscriptionPlan', 'free');
            
            setTimeout(() => {
                window.location.href = 'saas-dashboard.html';
            }, 1500);
        }
        
        // 페이지 로드 시 OAuth 콜백 처리
        handleOAuthCallback();
    </script>
</body>
</html>
