<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-2xl font-bold mb-6">🔍 Gemini API 모델 테스트</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">API 키 입력:</label>
            <input type="password" id="apiKey" class="w-full p-3 border rounded-lg" placeholder="AIza...">
        </div>
        
        <div class="space-y-3">
            <button onclick="listModels()" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600">
                1. 사용 가능한 모델 확인
            </button>
            
            <button onclick="testModel('gemini-1.5-flash')" class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600">
                2. gemini-1.5-flash 테스트
            </button>
            
            <button onclick="testModel('gemini-1.5-pro')" class="w-full bg-purple-500 text-white py-3 rounded-lg hover:bg-purple-600">
                3. gemini-1.5-pro 테스트
            </button>
            
            <button onclick="testModel('gemini-pro')" class="w-full bg-orange-500 text-white py-3 rounded-lg hover:bg-orange-600">
                4. gemini-pro 테스트
            </button>
        </div>
        
        <div class="mt-6">
            <h2 class="font-bold mb-2">결과:</h2>
            <pre id="result" class="bg-gray-100 p-4 rounded-lg min-h-[200px] overflow-auto text-sm"></pre>
        </div>
    </div>
    
    <script>
        async function listModels() {
            const apiKey = document.getElementById('apiKey').value;
            const resultEl = document.getElementById('result');
            
            if (!apiKey) {
                alert('API 키를 입력하세요!');
                return;
            }
            
            resultEl.textContent = '모델 리스트 가져오는 중...';
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`);
                const data = await response.json();
                
                if (response.ok) {
                    const models = data.models || [];
                    resultEl.textContent = '✅ 사용 가능한 모델:\n\n';
                    models.forEach(model => {
                        resultEl.textContent += `📌 ${model.name}\n`;
                        resultEl.textContent += `   - 지원 메서드: ${model.supportedGenerationMethods?.join(', ') || 'N/A'}\n`;
                        resultEl.textContent += `   - 설명: ${model.description || 'N/A'}\n\n`;
                    });
                } else {
                    resultEl.textContent = `❌ 에러: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.textContent = `❌ 에러: ${error.message}`;
            }
        }
        
        async function testModel(modelName) {
            const apiKey = document.getElementById('apiKey').value;
            const resultEl = document.getElementById('result');
            
            if (!apiKey) {
                alert('API 키를 입력하세요!');
                return;
            }
            
            resultEl.textContent = `${modelName} 테스트 중...`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: '안녕하세요! 간단한 인사말을 해주세요.'
                            }]
                        }]
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
                    resultEl.textContent = `✅ ${modelName} 성공!\n\n응답:\n${text}`;
                } else {
                    resultEl.textContent = `❌ ${modelName} 실패:\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.textContent = `❌ 에러: ${error.message}`;
            }
        }
    </script>
</body>
</html>
